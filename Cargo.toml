[package]
name = "game2048-ml"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Reproducible 2048 supervised policy learning research project"
license = "MIT"

[dependencies]
automl = { path = "automl" }
ndarray = "0.16"
polars = { version = "0.46", features = ["lazy", "csv", "json"] }
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rayon = "1.10"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
